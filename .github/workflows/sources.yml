name: Check sources monthly

# Wikipedia pages change. Once a month, re-check that every answer's figure
# still appears on its source page.

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm run check-sources
